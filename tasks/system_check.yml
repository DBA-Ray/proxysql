# 系统环境检测，排除干扰

- name: Proxysql status
  systemd:
    name: proxysql
    state: started
  register: result
  when: whether_uninstall | default(False)

- name: Stop proxysql server
  systemd:
    name: proxysql
    state: stopped
  when: whether_uninstall | default(False) and result is succeeded

- name: Create preparing directories for proxysql
  file: path={{ item }} state=directory owner=proxysql group=proxysql
  with_items:
    - "{{ backupdir }}"
    - "{{ package_dir }}"

- name: obtain current timestamp
  ansible.builtin.set_fact:
    backup_ts: "{{ ansible_date_time.date | replace('-','') }}_{{ ansible_date_time.time | replace(':','') }}"
  when: whether_uninstall | default(False)

- name: backup original db files and configuration files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backupdir }}/{{ item }}.{{ backup_ts }}"
    owner: proxysql
    group: proxysql
    remote_src: true
    mode: preserve
  loop:
    - /etc/proxysql.cnf
    - "{{ db_file }}"  
  when: whether_uninstall | default(False)

- name: Uninstall the installed proxysql(Redhat)
  yum:
    name: proxysql
    state: absent
  when: 
    - ansible_os_family == "RedHat"    
    - whether_uninstall | default(False)

- name: Uninstall the installed proxysql(Ubuntu)
  ansible.builtin.apt:
    name: proxysql
    state: absent
    purge: true
    autoremove: true
  when:    
    - ansible_os_family == "Debian"
    - whether_uninstall | default(False)

- name: Remove proxysql config file and proxysql directory
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/proxysql.cnf
    - "{{ datadir }}"
  when: whether_uninstall | default(False)

- name: install basic packages(redhat)
  yum:
    name: "{{ packages }}"
    state: latest
  when:
    - ansible_os_family == "RedHat"

- name: install basic packages(ubuntu)
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: latest
  when:
    - ansible_os_family == "Debian"

- name: install pexpect
  pip:
    name: pexpect
    state: latest