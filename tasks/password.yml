---
- name: Include password variables
  ansible.builtin.include_vars: secrets.yml
  no_log: true

- name: Assert required secrets
  ansible.builtin.assert:
    that:
      - admin_login_password is defined and (admin_login_password | length) > 0
      - mysql_monitor_password is defined and (mysql_monitor_password | length) > 0
      - root_password is defined and (root_password | length) > 0
      - business_password is defined and (business_password | length) > 0
      - read_only_password is defined and (read_only_password | length) > 0
      # ProxySQL admin_credentials 使用冒号分隔用户名/密码、分号分隔账号。
      # 这些字符无法直接嵌入该格式，提前拒绝，避免服务已启动却无法登录。
      - "':' not in admin_login_password and ';' not in admin_login_password"
      - "':' not in mysql_monitor_password and ';' not in mysql_monitor_password"
      - proxysql_admin_user != mysql_monitor_username
    fail_msg: "vars/secrets.yml 缺少必要密码变量 (admin_login_password / mysql_monitor_password / root_password / business_password / read_only_password)"
  no_log: true
