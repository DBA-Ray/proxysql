- name: Copy the latest ProxySQL
  copy:
    src: "{{ proxysql_upgrade_package }}"
    dest: "{{ package_dir }}"

- name: Stop keepalived
  systemd:
    name: keepalived
    state: stopped

- name: 停止proxysql服务
  systemd:
    name: proxysql
    state: stopped

- name: obtain current timestamp
  ansible.builtin.set_fact:
    backup_ts: "{{ ansible_date_time.date | replace('-','') }}_{{ ansible_date_time.time | replace(':','') }}"
  when: whether_uninstall | default(False)

- name: backup original db files and configuration files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ backupdir }}/{{ item }}.{{ backup_ts }}"
    owner: proxysql
    group: proxysql
    remote_src: true
    mode: preserve
  loop:
    - /etc/proxysql.cnf
    - "{{ db_file }}"  
    - "{{ db_stats_file }}"

- name: uninstall proxysql(redhat)
  yum:
    name: proxysql
    state: absent
  when:
    - ansible_os_family == "RedHat"

- name: uninstall proxysql(debian)
  ansible.builtin.apt:
    name: proxysql
    state: absent
    purge: true
    autoremove: true
  when:
    - ansible_os_family == "Debian"

- name: Install the latest ProxySQL(redhat)
  yum:
    name: "{{ package_dir }}/{{ proxysql_upgrade_package }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
  notify:
    - Start ProxySQL
    - Start keepalived

- name: Install the latest ProxySQL(debian)
  ansible.builtin.apt:
    name: "{{ package_dir }}/{{ proxysql_upgrade_package }}"
    state: present
  when:
    - ansible_os_family == "Debian"
  notify:
    - Start ProxySQL
    - Start keepalived

- name: Rename proxysql.rpmsave file to proxysql
  copy:
    src: /etc/logrotate.d/proxysql.rpmsave
    dest: /etc/logrotate.d/proxysql
    remote_src: yes
    owner: root
    group: root
    mode: '0644'

- name: copy proxysql.cnf to /etc/proxysql.cnf
  copy:
    src: "{{ backupdir }}/proxysql.cnf.{{ backup_ts }}"
    dest: /etc/proxysql.cnf
    remote_src: yes
    owner: proxysql
    group: proxysql
    mode: '0644'

- name: Start proxysql
  systemd:
    name: proxysql
    state: started