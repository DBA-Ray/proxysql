---
# vars file for proxysql_ray
# 基础软件包
packages:
  - vim
  - lrzsz
  - telnet
  - net-tools
  - tree
  - unzip
  - libaio
  - numactl
  - perl-DBD-mysql
  - expect
  - MySQL-python
  - zstd
  - epel-release
  - python-pip
  - curl
  - util-linux  # flock，防止定时任务重叠
  - coreutils  # timeout/stat/sort，限制运行时间并检查日志文件稳定性

packages_debian:
  - vim
  - lrzsz
  - telnet
  - net-tools
  - tree
  - unzip
  - numactl
  - expect
  - zstd
  - python3-pymysql
  - curl
  - util-linux
  - coreutils
